<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目索引主页</title>
  <!-- 引入图标库 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <!-- 谷歌字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --border-color: #e2e8f0;
    }

    .dark-mode {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      --border-color: #334155;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* 头部样式 */
    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 1.2rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .theme-toggle {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover {
      background-color: var(--bg-primary);
      color: var(--accent);
    }

    /* 主体内容 */
    main {
      padding: 3rem 0;
    }

    .page-title {
      text-align: center;
      margin-bottom: 3rem;
    }

    .page-title h1 {
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
      color: var(--text-primary);
    }

    .page-title p {
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
      font-size: 1.1rem;
    }

    /* 列表区域 - 核心部分 */
    .list-section {
      max-width: 800px;
      margin: 0 auto;
    }

    .list-card {
      background-color: var(--bg-secondary);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .list-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .list-items {
      list-style: none;
    }

    .list-item {
      border-bottom: 1px solid var(--border-color);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-link {
      display: flex;
      align-items: center;
      padding: 1.2rem 2rem;
      text-decoration: none;
      color: var(--text-primary);
      gap: 16px;
    }

    .list-link:hover {
      background-color: var(--accent);
      color: white !important;
      padding-left: 2.4rem;
    }

    .list-link i {
      font-size: 1.4rem;
      color: var(--accent);
      width: 24px;
      text-align: center;
    }

    .list-link:hover i {
      color: white;
    }

    .item-info {
      flex: 1;
    }

    .item-title {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .item-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .list-link:hover .item-desc {
      color: rgba(255, 255, 255, 0.9);
    }

    .item-arrow {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .list-link:hover .item-arrow {
      color: white;
      transform: translateX(4px);
    }

    /* 响应式适配 */
    @media (max-width: 768px) {
      .page-title h1 {
        font-size: 1.8rem;
      }
      
      .list-header, .list-link {
        padding: 1.2rem 1.5rem;
      }
      
      .list-link:hover {
        padding-left: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- 头部导航 -->
  <header>
    <div class="container">
      <div class="header-content">
        <a href="#" class="logo">
          <i class="fa fa-th-large"></i>
          <span>项目索引</span>
        </a>
        <button id="themeBtn" class="theme-toggle">
          <i class="fa fa-moon-o"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体内容 -->
  <main>
    <div class="container">
      <div class="page-title">
        <h1>欢迎访问项目索引</h1>
        <p>点击下方列表项，快速跳转到对应的页面</p>
      </div>

      <!-- ========== 列表区域 - 可自由修改链接 ========== -->
      <section class="list-section">
        <div class="list-card">
          <div class="list-header">
            <i class="fa fa-list-ul"></i>
            页面导航列表
          </div>
          
          <ul class="list-items">
            <!-- 链接1 -->
            <li class="list-item">
              <a href="./zs-trip.html" class="list-link">
                <i class="fa fa-home"></i>
                <div class="item-info">
                  <div class="item-title">首页</div>
                  <div class="item-desc">src/home.html - 项目主页面</div>
                </div>
                <i class="fa fa-angle-right item-arrow"></i>
              </a>
            </li>
            
            <!-- 链接2 -->
            <li class="list-item">
              <a href="./recipe.html" class="list-link">
                <i class="fa fa-play-circle"></i>
                <div class="item-info">
                  <div class="item-title">演示页面</div>
                  <div class="item-desc">src/demo.html - 功能演示</div>
                </div>
                <i class="fa fa-angle-right item-arrow"></i>
              </a>
            </li>
            
            <!-- 链接3 -->
            <li class="list-item">
              <a href="./sellroom.html" class="list-link">
                <i class="fa fa-file-text"></i>
                <div class="item-info">
                  <div class="item-title">文档页面</div>
                  <div class="item-desc">src/docs.html - 使用说明文档</div>
                </div>
                <i class="fa fa-angle-right item-arrow"></i>
              </a>
            </li>
            
        
            <!-- 可无限添加更多链接 -->
          </ul>
        </div>
      </section>
      <!-- ========== 列表区域结束 ========== -->
    </div>
  </main>

  <script>
    // 深色/浅色模式切换
    const themeBtn = document.getElementById('themeBtn');
    const body = document.body;
    const icon = themeBtn.querySelector('i');

    // 读取本地存储的主题
    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
      icon.classList.remove('fa-moon-o');
      icon.classList.add('fa-sun-o');
    }

    themeBtn.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      
      // 切换图标
      if (body.classList.contains('dark-mode')) {
        icon.classList.remove('fa-moon-o');
        icon.classList.add('fa-sun-o');
        localStorage.setItem('theme', 'dark');
      } else {
        icon.classList.remove('fa-sun-o');
        icon.classList.add('fa-moon-o');
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
</body>
</html>
