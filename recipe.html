<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孕晚期糖妈｜7天轮换菜谱｜喜好自定义版</title>
<style>
*{box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif;}
body{background:#f6f8fa;padding:14px;margin:0;}
.container{max-width:960px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #00000015;}
h1{color:#2c5c97;text-align:center;font-size:20px;margin-top:0;}
.note{background:#fff3cd;border-left:4px solid #ffc107;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;line-height:1.6;}
.preference-panel{background:#f0f7ff;padding:16px;border-radius:12px;margin-bottom:20px;}
.preference-panel h3{margin-top:0;color:#2c5c97;font-size:17px;}
.preference-panel > div{margin:10px 0 4px;font-weight:500;color:#334155;display:flex;flex-wrap: wrap;justify-content:space-between;align-items:center;}
.check-group{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px,1fr));gap:8px;margin:8px 0 16px;}
.check-group label{display:flex;gap:4px;cursor:pointer;font-size:14px;}
.shop-tag{display:inline-block;background:#e8f0fe;color:#2c5c97;font-size:12px;padding:2px 6px;border-radius:4px;margin-left:6px;}
.fish-tag{background:#e6f9ef;color:#198754;}
.day{border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px;}
.day h3{margin:0 0 10px;color:#2c5c97;border-bottom:1px solid #eee;padding-bottom:6px;}
.item{margin:8px 0;font-size:15px;line-height:1.7;display:flex;align-items:center;gap:8px;}
.time{font-weight:bold;color:#334155;min-width:70px;}
.food-icon{width:28px;height:28px;object-fit:contain;}
.btn-wrap{display:flex;gap:12px;justify-content:center;margin:16px 0;flex-wrap:wrap;}
.rotate-btn,.reset-btn,.clear-save-btn{padding:12px 24px;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
.rotate-btn{background:#2c5c97;color:white;}
.reset-btn{background:#94a3b8;color:#fff;}
.clear-save-btn{background:#dc3545;color:#fff;}
.small-btn{
    font-size:12px;
    padding:3px 8px;
    border:1px solid #2c5c97;
    background:#fff;
    color:#2c5c97;
    border-radius:4px;
    cursor:pointer;
}
.item-main-meal {
  font-size: 17px !important;
  font-weight: 600;
  color: #1f4682;
  background-color: #f0f6ff;
  padding: 6px 8px;
  border-radius: 6px;
  margin:4px 0;
}
</style>
</head>
<body>
<div class="container">
<h1>孕晚期糖妈｜7天轮换菜谱（喜好自定义）</h1>
<div class="note">
<b>⚠️ 重要规则（遵从医嘱单）</b><br>
1. 水果仅血糖＜6.7mmol/L才能吃，否则替换为去皮大番茄；<br>
2. 禁止粥、烂面、白馒头、糯米、土豆、红薯、南瓜、玉米、芋艿、勾芡浓汤；<br>
3. 每日蔬菜合计220g，每天2～3种蔬菜；每周2～3次豆制品（豆腐/豆干）；<br>
4. 黄豆、豌豆属于淀粉类蔬菜，食用后需相应减少主食分量；<br>
5. 三餐后20~30分钟温和运动，23点前休息。
</div>

<!-- ===== 个人喜好勾选区域 ===== -->
<div class="preference-panel">
<h3>✅ 我的食材喜好（勾选想要的，不勾选则随机不会出现）</h3>
<div>早餐主食 <button class="small-btn" onclick="toggleAll('breakfastCarb')">全选/取消</button></div>
<div class="check-group">
  <label><input type="checkbox" name="breakfastCarb" value="全麦面包50g">全麦面包</label>
  <label><input type="checkbox" name="breakfastCarb" value="纯燕麦50g">纯燕麦</label>
  <label><input type="checkbox" name="breakfastCarb" value="甜玉米50g">甜玉米</label>
  <label><input type="checkbox" name="breakfastCarb" value="低GI菜包50g">低GI菜包50g</label>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 4px;font-weight:500;color:#334155;">
  <span>牛肉系列</span>
  <button class="small-btn" onclick="toggleAll('beefList')">全选/取消</button>
</div>
<div class="check-group">
  <label><input type="checkbox" name="beefList" value="洋葱牛肉">洋葱牛肉</label>
  <label><input type="checkbox" name="beefList" value="牛腱子">牛腱子</label>
  <label><input type="checkbox" name="beefList" value="牛腩番茄">牛腩番茄</label>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 4px;font-weight:500;color:#334155;">
  <span>其他肉类</span>
  <button class="small-btn" onclick="toggleAll('otherMeatList')">全选/取消</button>
</div>
<div class="check-group">
  <label><input type="checkbox" name="otherMeatList" value="鸡肉">鸡肉</label>
  <label><input type="checkbox" name="otherMeatList" value="鸭肉">鸭肉</label>
  <label><input type="checkbox" name="otherMeatList" value="鸽子">鸽子</label>
  <label><input type="checkbox" name="otherMeatList" value="瘦猪肉">瘦猪肉</label>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 4px;font-weight:500;color:#334155;">
  <span>鱼/虾 (楼下鱼摊)</span>
  <button class="small-btn" onclick="toggleAll('fishList')">全选/取消</button>
</div>
<div class="check-group">
  <label><input type="checkbox" name="fishList" value="鲈鱼">鲈鱼</label>
  <label><input type="checkbox" name="fishList" value="鳕鱼">鳕鱼</label>
  <label><input type="checkbox" name="fishList" value="虾仁">虾仁</label>
  <label><input type="checkbox" name="fishList" value="大头虾">大头虾</label>
  <label><input type="checkbox" name="fishList" value="三文鱼">三文鱼</label>
</div>
<div>蔬菜 <button class="small-btn" onclick="toggleAll('vegList')">全选/取消</button></div>
<div class="check-group">
  <label><input type="checkbox" name="vegList" value="生菜">生菜</label>
  <label><input type="checkbox" name="vegList" value="油麦菜">油麦菜</label>
  <label><input type="checkbox" name="vegList" value="豆芽">豆芽</label>
  <label><input type="checkbox" name="vegList" value="黄豆">黄豆</label>
  <label><input type="checkbox" name="vegList" value="豌豆">豌豆</label>
  <label><input type="checkbox" name="vegList" value="豌豆苗">豌豆苗</label>
  <label><input type="checkbox" name="vegList" value="娃娃菜">娃娃菜</label>
  <label><input type="checkbox" name="vegList" value="香菇">香菇</label>
  <label><input type="checkbox" name="vegList" value="菠菜">菠菜</label>
  <label><input type="checkbox" name="vegList" value="黄瓜">黄瓜</label>
  <label><input type="checkbox" name="vegList" value="番茄">番茄</label>
  <label><input type="checkbox" name="vegList" value="苋菜">苋菜</label>
  <label><input type="checkbox" name="vegList" value="空心菜">空心菜</label>
  <label><input type="checkbox" name="vegList" value="茼蒿">茼蒿</label>
  <label><input type="checkbox" name="vegList" value="西兰花">西兰花</label>
  <label><input type="checkbox" name="vegList" value="木耳菜">木耳菜</label>
  <label><input type="checkbox" name="vegList" value="青菜">青菜</label>
  <label><input type="checkbox" name="vegList" value="卷心菜">卷心菜</label>
</div>
<div>豆制品 <button class="small-btn" onclick="toggleAll('beanList')">全选/取消</button></div>
<div class="check-group">
  <label><input type="checkbox" name="beanList" value="嫩豆腐25g">嫩豆腐</label>
  <label><input type="checkbox" name="beanList" value="厚豆干25g">厚豆干</label>
</div>
<div>水果（血糖达标才吃） <button class="small-btn" onclick="toggleAll('fruitList')">全选/取消</button></div>
<div class="check-group">
  <label><input type="checkbox" name="fruitList" value="猕猴桃1只">绿猕猴桃</label>
  <label><input type="checkbox" name="fruitList" value="苹果半个">苹果</label>
  <label><input type="checkbox" name="fruitList" value="圣女果">圣女果</label>
  <label><input type="checkbox" name="fruitList" value="蓝莓">蓝莓</label>
</div>
<div>坚果 <button class="small-btn" onclick="toggleAll('nutList')">全选/取消</button></div>
<div class="check-group">
  <label><input type="checkbox" name="nutList" value="10g核桃">核桃</label>
  <label><input type="checkbox" name="nutList" value="10g开心果">开心果</label>
  <label><input type="checkbox" name="nutList" value="10g黑芝麻粉">黑芝麻粉</label>
</div>
</div>

<div class="btn-wrap">
  <button class="rotate-btn" onclick="randomMenu()">🔀 按我的喜好，随机生成一周菜谱</button>
  <button class="reset-btn" onclick="resetCheck()">🔄 重置全部喜好勾选</button>
  <button class="clear-save-btn" onclick="clearSavedMenu()">🗑️ 清空本地保存菜谱</button>
</div>
<div id="menuBox"></div>
<script>
const STORAGE_KEY = "tangma_menu_save_v4";
const CHECK_KEY = "tangma_check_save_v4";

function getCheckedValues(name) {
  const inputs = document.querySelectorAll(`input[name="${name}"]:checked`);
  return Array.from(inputs).map(i => i.value);
}

function getRandom(arr) {
  if (!arr || arr.length === 0) return "";
  return arr[Math.floor(Math.random() * arr.length)];
}

function pickUnique(arr, count) {
  const copy = [...arr];
  const result = [];
  for (let i = 0; i < count && copy.length > 0; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    result.push(copy.splice(idx, 1)[0]);
  }
  return result;
}

function toggleAll(name) {
  const inputs = document.querySelectorAll(`input[name="${name}"]`);
  const allChecked = Array.from(inputs).every(cb => cb.checked);
  inputs.forEach(cb => cb.checked = !allChecked);
  saveCheckStatus();
}

function renderMenu(menuData) {
  const daysName = ["周一", "周二", "周三", "周四", "周五"];
  let html = "";

  for (let i = 0; i < 5; i++) {
    const d = menuData[i];
    const beefItem = d.beef || "【请勾选牛肉系列】";
    const lunchSecondProtein = d.lunchSecondProtein || "【请勾选其他肉类/鱼虾】";
    const dinnerSecondProtein = d.dinnerSecondProtein || "【请勾选其他肉类/鱼虾】";
    const beanText = d.beanText || "";
    const vegAll = d.vegAll && d.vegAll.length ? d.vegAll.join("、") : "";

    html += `
    <div class="day">
      <h3>${daysName[i]}</h3>
      <div class="item">🍵 空腹：一杯温水</div>
      <div class="item">🥚 早餐8:15前：水煮蛋50g + ${d.breakfastCarb} + 🥬${d.vegB} + 叶酸</div>
      <div class="item">🥛 加餐10:00：200ml纯牛奶 + 🥒黄瓜</div>
      <div class="item item-main-meal">🍚 午餐11:50：杂粮饭100g + 🥩${beefItem} + ${lunchSecondProtein} ${beanText} + 🥬${d.vegL}</div>
      <div class="item">🍅 14:00：去皮大番茄（血糖达标加${d.fruit}）</div>
      <div class="item">🥛 16:00加餐：100ml无糖酸奶 + 🥜${d.nut}</div>
      <div class="item item-main-meal">🍚 晚餐18:30：杂粮饭100g + 🥩${beefItem} + ${dinnerSecondProtein} + 🥦${d.vegD}</div>
      <div class="item">🥛 21:30加餐：100ml无糖酸奶 + DGI饼干20g</div>
      <div style="margin-top:8px;color:#2c5c97;font-size:14px;"><b>当日蔬菜合计220g：</b>${vegAll}</div>
    </div>`;
  }

  document.getElementById("menuBox").innerHTML = html;
}

function generateMenuData() {
  const breakfastCarbList = getCheckedValues("breakfastCarb");
  const beefList = getCheckedValues("beefList");
  const otherMeatList = getCheckedValues("otherMeatList");
  const fishList = getCheckedValues("fishList");
  const vegList = getCheckedValues("vegList");
  const beanList = getCheckedValues("beanList");
  const fruitList = getCheckedValues("fruitList");
  const nutList = getCheckedValues("nutList");

  const weekData = [];

  // 5天内随机选2~3天安排豆制品
  const totalBeanDays = 2 + Math.floor(Math.random() * 2);
  const allDayIndexes = [0, 1, 2, 3, 4];
  const beanDays = [];
  for (let i = 0; i < totalBeanDays; i++) {
    const r = Math.floor(Math.random() * allDayIndexes.length);
    beanDays.push(allDayIndexes.splice(r, 1)[0]);
  }

  for (let i = 0; i < 5; i++) {
    let beanText = "";
    if (beanDays.includes(i) && beanList.length > 0) {
      beanText = "+ " + getRandom(beanList);
    }

    // 当天固定同一份牛肉，午晚餐共用
    const dayBeef = getRandom(beefList);

    // 第二荤：60%其他肉类，40%鱼类
    function getSecondProtein() {
      const rand = Math.random();
      if(rand < 0.6 && otherMeatList.length > 0) {
        return getRandom(otherMeatList);
      } else if(fishList.length >0) {
        return getRandom(fishList);
      }
      return "【请勾选其他肉类/鱼虾】";
    }

    const lunchSecond = getSecondProtein();
    const dinnerSecond = getSecondProtein();

    // 蔬菜逻辑不变
    const vegCount = 3 + Math.round(Math.random() * 2);
    const dayVegs = pickUnique(vegList, vegCount);

    weekData.push({
      breakfastCarb: getRandom(breakfastCarbList),
      beef: dayBeef,
      lunchSecondProtein: lunchSecond,
      dinnerSecondProtein: dinnerSecond,
      vegB: dayVegs[0] || "",
      vegL: dayVegs.slice(0, 2).join("、"),
      vegD: dayVegs.slice(2).join("、"),
      vegAll: dayVegs,
      fruit: getRandom(fruitList),
      nut: getRandom(nutList),
      beanText: beanText
    });
  }
  return weekData;
}

function randomMenu() {
  const weekData = generateMenuData();
  renderMenu(weekData);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(weekData));
  saveCheckStatus();
  console.log("✅ 已重新生成【周一至周五】菜谱\n🥩 每日固定牛肉一份，午晚餐双荤\n🥩 第二荤60%其他肉类，40%鱼虾\n🥬 每日蔬菜2~3种，合计220g\n🥢 本周自动安排2~3次豆制品");
}

function saveCheckStatus() {
  const checkBoxes = document.querySelectorAll('.preference-panel input[type="checkbox"]');
  const checkState = {};
  checkBoxes.forEach(cb => {
    checkState[cb.value] = cb.checked;
  });
  localStorage.setItem(CHECK_KEY, JSON.stringify(checkState));
}

function loadCheckStatus() {
  const saved = localStorage.getItem(CHECK_KEY);
  if (!saved) return;
  const checkState = JSON.parse(saved);
  const checkBoxes = document.querySelectorAll('.preference-panel input[type="checkbox"]');
  checkBoxes.forEach(cb => {
    if (Object.prototype.hasOwnProperty.call(checkState, cb.value)) {
      cb.checked = checkState[cb.value];
    }
  });
}

function resetCheck() {
  document.querySelectorAll('.preference-panel input[type="checkbox"]').forEach(cb => cb.checked = true);
  saveCheckStatus();
  alert("✅ 已重置所有食材勾选");
}

function clearSavedMenu() {
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(CHECK_KEY);
  alert("🗑️ 本地数据已清空，刷新页面后重新开始");
}

window.addEventListener("load", function () {
  loadCheckStatus();

  const savedMenuJson = localStorage.getItem(STORAGE_KEY);
  if (savedMenuJson) {
    try {
      const savedMenu = JSON.parse(savedMenuJson);
      if (savedMenu && savedMenu.length === 5) {
        renderMenu(savedMenu);
        return;
      }
    } catch (e) {
      console.warn("旧菜谱数据解析失败，重新生成");
    }
  }

  randomMenu();
});
</script>
</body>
</html>
